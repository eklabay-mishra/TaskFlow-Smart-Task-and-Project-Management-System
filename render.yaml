services:
  - type: web
    name: taskflow-enterprise
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: TaskFlow Enterprise
      - key: DB_HOST
        value: 127.0.0.1
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: taskflow_db
      - key: DB_USER
        value: root
      - key: DB_PASS
        value: ""
